# Kế hoạch dự thảo. Ngày dự kiến và ngưỡng do nhóm xác nhận trước khi chạy.
# D1 · Baseline 0,70; alpha 0,05; power 0,80; ICC 0,02.
# a) Theo yêu cầu, tăng 5 điểm: 1.251 yêu cầu mỗi nhóm.
# b) Theo nhân viên, m=75: DE=2,48; cần 3.103 yêu cầu và 42 nhân viên mỗi nhóm.
# c) 20 nhân viên mỗi nhóm: trần cỡ mẫu hiệu dụng là 20/0,02 = 1.000 mỗi nhóm.
# d) 6 depot mỗi nhóm: trần cỡ mẫu hiệu dụng là 6/0,02 = 300 mỗi nhóm.
# e) Tăng 6 điểm: cần 859 hiệu dụng mỗi nhóm. Giải 20m/(0,98+0,02m) ≥ 859
#    được m ≥ 299, DE=6,96 và 5.980 yêu cầu mỗi nhóm.
# D2 · Khả năng tách tác động.
# 1. Đối chứng chạy cùng kỳ, cùng depot, cùng tiêu chí tiếp nhận.
# 2. Ngẫu nhiên theo staff_id, phân tầng depot, lưu seed và danh sách phân nhóm trước rollout.
# 3. Kiểm soát quyền theo tài khoản; theo dõi truy cập chéo và ghi nhận điều chuyển ca.
# 4. Chốt chỉ số, ngưỡng, luật dừng và lịch trước khi bật.
# 5. Đúng 20 cụm nhân viên mỗi nhóm nếu huy động đủ 40 nhân viên.
# Đánh đổi: tại 859 hiệu dụng mỗi nhóm, power cho mức tăng 5 điểm chỉ khoảng 0,64.
# Mở lại trong 7 ngày: 51/1.200 = 4,25% toàn mẫu; 39/982 = 3,97% trong phạm vi.

pilot:
  owner: Giám đốc vận hành LogiX-VN
  scope: "Yêu cầu noi_dia và hang_nang tại các depot có nhân viên ở cả hai nhánh. Xác nhận danh sách depot và khả năng đủ 40 nhân viên trước khi chạy."
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    stratify_by: depot
    random_seed: 1306
    analysis: "Phân tích theo phân nhóm ban đầu ở giai đoạn 50%, kể cả yêu cầu không dùng trợ lý. Ước lượng chênh lệch theo điểm phần trăm với sai số chuẩn theo cụm nhân viên, có điều chỉnh depot."
  rollout: [0.10, 0.25, 0.50]
  rollout_schedule: "Bật cho 4 rồi 10 rồi 20 nhân viên trong nhánh can thiệp đã định trước, tối thiểu một tuần mỗi bước. Chỉ thu ca cho phân tích chính khi đủ 20 nhân viên can thiệp và 20 đối chứng. Chờ dữ liệu an toàn đủ hạn trước khi tăng rollout."
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
    target_requests_per_staff: 299
    target_requests_per_arm: 5980
    sample_check: "Kiểm số ca đủ điều kiện và đủ thời gian theo dõi theo từng nhân viên và từng nhánh trước khi xem hiệu ứng chính. Khi lưu lượng lệch giữa các nhân viên, tính n hiệu dụng bằng bình phương tổng số ca chia tổng của m × (1 + (m − 1) × 0,02) trên các nhân viên, với m là số ca của từng người. Yêu cầu ít nhất 859 hiệu dụng và 20 cụm mỗi nhánh."
    followup: "Chốt kết quả sau khi mọi yêu cầu thuộc kỳ đo có ít nhất 8 ngày từ khi tạo, đủ để quan sát đóng trong 24 giờ và mở lại trong 7 ngày sau đóng."
  identifiability:
    concurrent_control: "Cùng kỳ, cùng depot, giữ quy trình tiếp nhận và chính sách hoàn phí như nhau."
    spillover_risk: "Cấp quyền theo tài khoản, giữ nguyên luồng phân ca, theo dõi lượt mở trợ lý của staff_id ở nhánh đối chứng."
    predeclared: "Chốt ngày, ngưỡng, cách phân tích, cách xử lý ca thiếu log và danh sách phân nhóm trước lần bật đầu."
  stop_rules:
    - "NẾU có ít nhất 1 ca hoàn trùng được xác nhận TRONG thời gian pilot THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ chỉ tiếp tục khi các luật còn lại đạt."
    - "NẾU tỷ lệ mở lại 7 ngày của nhánh can thiệp vượt 6% hoặc cao hơn đối chứng từ 2 điểm phần trăm TRONG 2 tuần có số liệu theo dõi đủ hạn liên tiếp THÌ Giám đốc vận hành tạm dừng và giao CSKH kiểm nguyên nhân KHÔNG THÌ chỉ tăng rollout khi chi phí và mức sử dụng đạt."
    - "NẾU chi phí biến đổi mỗi việc thành công theo phút đo thực tế vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp về noi_dia và kiểm tra giới hạn 2 lần chạy KHÔNG THÌ giữ phạm vi đã duyệt."
    - "NẾU tỉ lệ sửa hoặc bỏ đề xuất vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH giữ nguyên mức rollout và phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ chỉ tăng rollout khi an toàn và chi phí đạt."
  interim_looks: "Kiểm an toàn, chi phí vận hành và mức sử dụng. Chỉ kiểm định chỉ số chính ở thời điểm phân tích đã đăng ký."
  rollback: "Giám đốc vận hành tắt cờ trong 30 phút. CSKH tiếp nhận các ca đang mở và đối soát sổ cái trước khi xử lý tiếp."
  decision_date: "2027-01-05"
  decision_date_status: "Mốc dự kiến theo hướng dẫn lab. Nếu thiếu cụm, cỡ mẫu hiệu dụng hoặc thời gian theo dõi, ghi chưa đủ bằng chứng và chốt lịch mới trước khi xem hiệu ứng chính."
  decision_rule: "Cân nhắc mở rộng nếu ước lượng cải thiện ít nhất 5 điểm phần trăm, cận dưới khoảng tin cậy 95% lớn hơn 0 và các điều kiện an toàn, chi phí, sử dụng đều đạt. Mức 6 điểm là MDE của thiết kế. Thiếu mẫu hoặc thời gian theo dõi thì ghi chưa đủ bằng chứng trước khi xem hiệu ứng chính."
  simulated_inputs:
    - "Phút xem lại và phút làm lại từ phut_xem_lai_simulated và phut_lam_lai_simulated, dùng trong A/B."
    - "Giá token, tool, lương 2.000 đ/phút, baseline 12.000 đ/yêu cầu, cố định 40 triệu đ/tháng là giả định lab."
    - "Baseline kết quả 0,70 và ICC 0,02 là giả định lập kế hoạch. Rà lại lưu lượng và phân bố theo nhân viên trước khi chạy."
